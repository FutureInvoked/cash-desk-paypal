# Keeps the hosted demo awake: Render's free plan sleeps after ~15 idle minutes, and the first visit
# after that waits about a minute. A GET of the health check (never rate-limited, opens no workspace)
# every 10 minutes keeps it warm. One always-on free service fits Render's free monthly hours.
name: Keep the hosted demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: GET /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 https://cash-desk-paypal.onrender.com/api/health
