[project]
name = "cashdesk-paypal"
version = "0.1.0"
description = "Cash Desk for PayPal: an AI reconciliation and collections desk with an approval-gated agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "httpx==0.28.1",
  "anthropic==2.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cashdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
